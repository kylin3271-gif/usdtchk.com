<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>批量查询余额和多签状态 - 查地址</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0f3f8;color:#111;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:40px}
.top{background:#fff;border-bottom:1px solid #eef1f5}.top-in{max-width:1100px;margin:0 auto;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:18px;font-weight:800;display:flex;gap:8px;align-items:center;cursor:pointer}.logo i{width:28px;height:28px;border-radius:50%;background:#FF0013;color:#fff;display:flex;align-items:center;justify-content:center;font-style:normal}
.back{font-size:13px;border:1px solid #e2e6ec;border-radius:999px;padding:7px 12px;background:#fff}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
h1{font-size:24px;text-align:center;margin:28px 0 8px}.sub{text-align:center;color:#666;font-size:13px;margin-bottom:16px}
.card{background:#fff;border-radius:14px;padding:16px;margin:14px 0}
textarea{width:100%;height:140px;border:1px solid #e2e6ec;border-radius:10px;padding:12px;font-size:14px;outline:none;resize:vertical;line-height:1.6}
.hint{font-size:12px;color:#888;margin:8px 2px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}.btn-row button{border:0;border-radius:10px;padding:12px 22px;font-weight:700;cursor:pointer}.btn-go{background:#4e6ef2;color:#fff}.btn-clear{background:#f1f5f9}.btn-export{background:#111;color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:860px}th{color:#666;font-weight:500;text-align:left;padding:10px 8px;border-bottom:1px solid #eee;white-space:nowrap}td{padding:10px 8px;border-bottom:1px solid #f1f2f4;word-break:break-all}
.t-wrap{overflow-x:auto}.addr{font-family:monospace;max-width:200px}
.pill{border-radius:999px;padding:4px 10px;font-weight:700;font-size:12px}.pill.yes{background:#fee2e2;color:#b91c1c}.pill.no{background:#dcfce7;color:#15803d}
.empty{text-align:center;color:#888;padding:20px;font-size:13px}
.summary{font-size:13px;margin:6px 2px}
@media(max-width:640px){h1{font-size:20px}}
</style>
</head>
<body>
<div class="top"><div class="top-in"><div class="logo" onclick="location.href='/'"><i>T</i><span>查地址</span></div><a class="back" href="/">← 返回首页</a></div></div>
<div class="wrap">
<h1>批量查询余额和多签状态</h1>
<p class="sub">支持 TRX / ETH 地址 · 一行一个，最多 50 个 · 直接查询链上数据</p>
<div class="card">
<textarea id="addrs" placeholder="一行一个地址"></textarea>
<p class="hint">提示：每行一个地址，支持 T 开头（波场）和 0x 开头（以太坊），会自动去重、自动跳过空行。</p>
<div class="btn-row"><button class="btn-go" id="goBtn" onclick="doBatch()">开始查询</button><button class="btn-clear" onclick="clearAll()">清空</button><button class="btn-export" onclick="exportExcel()">导出 Excel</button></div>
</div>
<div class="summary" id="summary">—</div>
<div class="card" style="padding:8px 10px"><div class="t-wrap"><table><thead><tr><th>#</th><th>地址</th><th>TRX / ETH</th><th>USDT</th><th>能量</th><th>CNY价值</th><th>是否多签</th><th>激活时间</th></tr></thead><tbody id="tbody"></tbody></table></div><div id="empty" class="empty">暂无数据，请在上方输入地址后查询</div></div>
<p style="text-align:center;color:#aaa;font-size:12px;margin-top:10px">数据来源：TronGrid + Tronscan + Blockscout · 仅供查询</p>
</div>
<script>
let PRICE={usdt:6.67,trx:2.06,eth:11835};
let results=[];
async function loadPrice(){try{const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=tether,tron,ethereum&vs_currencies=cny').then(r=>r.json());if(r.tether)PRICE.usdt=r.tether.cny;if(r.tron)PRICE.trx=r.tron.cny;if(r.ethereum)PRICE.eth=r.ethereum.cny;}catch(e){}}
loadPrice();
function fmtTime(ts){if(!ts)return '—';const d=new Date(ts),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}
function short(a){if(!a)return '—';return a.slice(0,8)+'...'+a.slice(-6);}
function clearAll(){document.getElementById('addrs').value='';document.getElementById('tbody').innerHTML='';document.getElementById('empty').style.display='block';document.getElementById('summary').textContent='—';results=[];}
async function queryTron(addr){
  let trx=0,usdt=0,energy=0,createTime=0,multi='否';
  try{const a=await fetch('https://apilist.tronscanapi.com/api/account?address='+addr).then(r=>r.json());if(a){trx=(a.balance||0)/1e6;createTime=a.createTime||0;if(a.trc20token_balances){const u=a.trc20token_balances.find(x=>x.tokenId==='TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t');if(u)usdt=parseFloat(u.balance||0);}}}
  catch(e){}
  try{const b=await fetch('https://api.trongrid.io/v1/accounts/'+addr).then(r=>r.json());const d=b.data&&b.data[0];if(d){trx=(d.balance||0)/1e6;createTime=d.create_time||createTime;if(d.trc20){const arr=d.trc20.find(x=>x['TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t']);if(arr)usdt=parseFloat(arr['TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t']||0)/1e6;}}}
  catch(e){}
  try{const e=await fetch('https://api.trongrid.io/wallet/getaccountresource',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address:addr,visible:true})}).then(r=>r.json());if(e)energy=Math.max(0,(e.EnergyLimit||0)-(e.EnergyUsed||0));}catch(e){}
  try{const p=await fetch('https://api.trongrid.io/wallet/getaccount',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address:addr,visible:true})}).then(r=>r.json());if(p&&p.permission){const o=p.permission.owner;if(o&&o.keys&&o.keys.length>1)multi='是';if(p.permission.active&&p.permission.active.length>0)multi='是';}}catch(e){}
  return {addr,main:trx,mainSym:'TRX',usdt,energy:energy.toLocaleString(),cny:trx*PRICE.trx+usdt*PRICE.usdt,multi,active:fmtTime(createTime)};
}
async function queryEth(addr){
  let eth=0,usdt=0;
  try{const r=await fetch('https://eth.blockscout.com/api/v2/addresses/'+addr).then(r=>r.json());if(r)eth=parseFloat(r.coin_balance||0)/1e18;}catch(e){}
  try{const r=await fetch('https://eth.blockscout.com/api/v2/addresses/'+addr+'/token-balances').then(r=>r.json());(Array.isArray(r)?r:[]).forEach(t=>{if(t.token&&t.token.symbol==='USDT')usdt=parseFloat(t.value||0)/Math.pow(10,t.token.decimals||6);});}catch(e){}
  return {addr,main:eth,mainSym:'ETH',usdt,energy:'—',cny:eth*PRICE.eth+usdt*PRICE.usdt,multi:'—',active:'—'};
}
async function doBatch(){
  let lines=document.getElementById('addrs').value.split('\n').map(s=>s.trim()).filter(Boolean);
  lines=[...new Set(lines)];
  if(!lines.length){alert('请先输入地址');return;}
  if(lines.length>50){alert('最多一次 50 个，已截取前 50 个');lines=lines.slice(0,50);}
  const btn=document.getElementById('goBtn');btn.disabled=true;btn.textContent='查询中…';
  document.getElementById('tbody').innerHTML='';document.getElementById('empty').style.display='none';
  results=[];
  let i=0;
  for(const addr of lines){
    i++;
    let row=document.createElement('tr');row.innerHTML='<td>'+i+'</td><td class="addr">'+addr+'</td><td colspan="6">查询中…</td>';document.getElementById('tbody').appendChild(row);
    let res;
    try{res=addr.startsWith('T')?await queryTron(addr):await queryEth(addr);}catch(e){res={addr,main:0,mainSym:addr.startsWith('T')?'TRX':'ETH',usdt:0,energy:'—',cny:0,multi:'—',active:'—'};}
    results.push(res);
    row.innerHTML='<td>'+i+'</td><td class="addr" title="'+addr+'">'+short(addr)+'</td><td>'+res.main.toLocaleString(undefined,{maximumFractionDigits:6})+' '+res.mainSym+'</td><td>'+res.usdt.toLocaleString(undefined,{maximumFractionDigits:6})+' USDT</td><td>'+res.energy+'</td><td>'+res.cny.toLocaleString(undefined,{maximumFractionDigits:2})+' ¥</td><td><span class="pill '+(res.multi==='是'?'yes':'no')+'">'+res.multi+'</span></td><td>'+res.active+'</td>';
    document.getElementById('summary').innerHTML='共 <b>'+results.length+'</b> 个 · 合计 USDT <b>'+results.reduce((a,b)=>a+b.usdt,0).toLocaleString(undefined,{maximumFractionDigits:2})+'</b> · 合计 CNY <b>'+results.reduce((a,b)=>a+b.cny,0).toLocaleString(undefined,{maximumFractionDigits:2})+' ¥</b>';
    await new Promise(r=>setTimeout(r,150));
  }
  btn.disabled=false;btn.textContent='开始查询';
}
function exportExcel(){
  if(!results.length){alert('暂无数据');return;}
  let rows=[['地址','TRX/ETH','USDT','能量','CNY价值','是否多签','激活时间']];
  results.forEach(x=>rows.push([x.addr,x.main+' '+x.mainSym,x.usdt,x.energy,x.cny,x.multi,x.active]));
  let csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  let blob=new Blob(['\ufeff'+csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='batch_balance.csv';a.click();
}
</script>
</body>
</html>
