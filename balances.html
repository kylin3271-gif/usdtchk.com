<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>批量查询USDT余额和多签状态 - 查地址</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0f3f8;color:#111;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:40px}
a{color:inherit;text-decoration:none}
.top{background:#fff;border-bottom:1px solid #eef1f5}
.top-in{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;cursor:pointer}
.top-right{display:flex;align-items:center;gap:8px}
.backup-top{background:#fff;color:#666;border:1px dashed #dbe1ea;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;white-space:nowrap;cursor:default}
.lang-wrap{display:flex;align-items:center;gap:4px;background:#f1f5f9;border:1px solid #e2e6ec;border-radius:999px;padding:4px 8px 4px 10px;flex-shrink:0}
.lang-wrap span{font-size:14px}
.lang-sel{border:0;background:transparent;font-size:13px;font-weight:600;outline:none;cursor:pointer;max-width:110px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
h1{font-size:24px;font-weight:800;text-align:center;margin:28px 0 6px}
.card{background:#fff;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 1px 6px rgba(0,0,0,.03)}
textarea{width:100%;height:480px;min-height:480px;border:1.5px solid #cbd5e1;border-radius:14px;padding:16px 18px;font-size:16px;line-height:1.7;outline:none;resize:vertical;font-family:monospace}
textarea:focus{border-color:#2f7bff;box-shadow:0 0 0 3px rgba(47,123,255,.15)}
.bar{display:flex;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap}
.bar button{background:#2f7bff;color:#fff;border:0;border-radius:999px;padding:12px 32px;font-size:15px;font-weight:700;cursor:pointer}
.bar button:nth-child(3){background:#f59e0b}
.bar button:nth-child(4),.bar button:nth-child(5){background:#fff;color:#111;border:1.5px solid #dbe1ea;font-weight:600}
.bar span{font-size:14px;color:#666}
.total{font-size:15px;font-weight:600;margin:14px 0 6px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px;min-width:720px}
th{background:#1e4a8a;color:#fff;font-weight:600;text-align:left;padding:12px 10px;white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid #eee}
.empty{padding:28px 0;text-align:center;color:#888;font-size:13px}
@media(max-width:640px){textarea{height:360px;min-height:360px;font-size:15px}.bar button{padding:11px 20px;font-size:14px}.backup-top{padding:7px 12px;font-size:12px}.lang-sel{max-width:92px}}
</style></head>
<body>
<div class="top"><div class="top-in">
  <div class="logo" onclick="location.href='/'" title="返回首页">
    <div style="width:28px;height:28px;border-radius:50%;background:#FF0013;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;line-height:1;flex-shrink:0">T</div>
    <span data-i18n="logo">查地址</span>
  </div>
  <div class="top-right">
    <span class="backup-top" data-i18n="backup">备用网站</span>
    <div class="lang-wrap"><span>🌐</span><select id="langSelect" class="lang-sel" onchange="setLang(this.value)">
      <option value="zh">简体中文</option><option value="hant">繁體中文</option><option value="en">English</option><option value="th">ไทย</option><option value="vi">Tiếng Việt</option><option value="id">Bahasa Indonesia</option>
    </select></div>
  </div>
</div></div>
<div class="wrap">
  <h1 data-i18n="h1">批量查询USDT余额和多签状态（仅支持TRON地址）</h1>
  <div class="card">
  <textarea id="input" data-i18n-ph="ph" placeholder="一行一个地址&#10;最大填写2000个&#10;仅支持填写T开头的地址，34位"></textarea>
  <div class="bar"><button onclick="doBatch()" data-i18n="query">查询</button><span id="prog"></span><button type="button" onclick="retryFailed()" data-i18n="retry">重试失败</button><button type="button" onclick="exportCSV()" data-i18n="export">导出 Excel</button><button type="button" onclick="copyMulti()" data-i18n="copyMulti">复制多签地址</button></div>
  <div id="total" class="total" style="display:none"></div>
  <div class="table-wrap"><table id="tbl" style="display:none"><thead><tr><th><input type="checkbox" onclick="document.querySelectorAll('.chk').forEach(c=>c.checked=this.checked)"></th><th data-i18n="no">序号</th><th data-i18n="addr">地址</th><th onclick="sortBy('trx')" style="cursor:pointer">TRX ◆</th><th onclick="sortBy('usdt')" style="cursor:pointer">USDT ◆</th><th onclick="sortBy('usdd')" style="cursor:pointer">USDD ◆</th><th data-i18n="multi">多签状态</th><th data-i18n="status">状态</th></tr></thead><tbody id="tbody"></tbody></table></div>
  <div id="empty" class="empty" data-i18n="empty">输入地址后点查询</div>
  </div>
</div>
<script>
const I18N={
zh:{logo:"查地址",backup:"备用网站",h1:"批量查询USDT余额和多签状态（仅支持TRON地址）",ph:"一行一个地址\n最大填写2000个\n仅支持填写T开头的地址，34位",query:"查询",retry:"重试失败",export:"导出 Excel",copyMulti:"复制多签地址",no:"序号",addr:"地址",multi:"多签状态",status:"状态",empty:"输入地址后点查询",yes:"是",no2:"否",success:"成功",fail:"失败",checked:"已查询：",ok:"成功：",fail2:"失败：",done:"已完成",searching:"查询中…",retrying:"正在重试",noFail:"没有失败的地址",noMulti:"没有多签地址",copied:"已复制",noData:"暂无数据",enterAddr:"请先输入地址",max2000:"最大填写2000个",badAddr:"必须是34位 T 开头地址：",batchFail:"批量查询失败"},
hant:{logo:"查地址",backup:"備用網站",h1:"批量查詢USDT餘額和多簽狀態（僅支援TRON地址）",ph:"一行一個地址\n最大填寫2000個\n僅支援填寫T開頭的地址，34位",query:"查詢",retry:"重試失敗",export:"匯出 Excel",copyMulti:"複製多簽地址",no:"序號",addr:"地址",multi:"多簽狀態",status:"狀態",empty:"輸入地址後點查詢",yes:"是",no2:"否",success:"成功",fail:"失敗",checked:"已查詢：",ok:"成功：",fail2:"失敗：",done:"已完成",searching:"查詢中…",retrying:"正在重試",noFail:"沒有失敗的地址",noMulti:"沒有多簽地址",copied:"已複製",noData:"暫無數據",enterAddr:"請先輸入地址",max2000:"最大填寫2000個",badAddr:"必須是34位 T 開頭地址：",batchFail:"批量查詢失敗"},
en:{logo:"Check Address",backup:"Backup Site",h1:"Batch USDT Balance & Multi-Sig Check (TRON only)",ph:"One address per line\nMax 2000 addresses\nOnly T addresses, 34 chars",query:"Search",retry:"Retry Failed",export:"Export Excel",copyMulti:"Copy Multi-Sig",no:"No.",addr:"Address",multi:"Multi-Sig",status:"Status",empty:"Enter addresses then Search",yes:"Yes",no2:"No",success:"Success",fail:"Failed",checked:"Checked:",ok:"Success:",fail2:"Failed:",done:"Done",searching:"Searching…",retrying:"Retrying",noFail:"No failed addresses",noMulti:"No multi-sig addresses",copied:"Copied",noData:"No data",enterAddr:"Please enter addresses first",max2000:"Max 2000 addresses",badAddr:"Must be 34-char T address:",batchFail:"Batch query failed"},
th:{logo:"เช็คที่อยู่",backup:"เว็บสำรอง",h1:"เช็คยอด USDT & Multi-Sig หลายรายการ (TRON เท่านั้น)",ph:"ที่อยู่ละ 1 บรรทัด\nสูงสุด 2000 ที่อยู่\nเฉพาะที่อยู่ขึ้นต้น T 34 หลัก",query:"ค้นหา",retry:"ลองใหม่ที่ล้มเหลว",export:"ส่งออก Excel",copyMulti:"คัดลอก Multi-Sig",no:"ลำดับ",addr:"ที่อยู่",multi:"Multi-Sig",status:"สถานะ",empty:"กรอกที่อยู่แล้วกดค้นหา",yes:"ใช่",no2:"ไม่",success:"สำเร็จ",fail:"ล้มเหลว",checked:"ตรวจสอบแล้ว:",ok:"สำเร็จ:",fail2:"ล้มเหลว:",done:"เสร็จแล้ว",searching:"กำลังค้นหา…",retrying:"กำลังลองใหม่",noFail:"ไม่มีที่อยู่ที่ล้มเหลว",noMulti:"ไม่มีที่อยู่ Multi-Sig",copied:"คัดลอกแล้ว",noData:"ไม่มีข้อมูล",enterAddr:"กรุณากรอกที่อยู่ก่อน",max2000:"สูงสุด 2000 ที่อยู่",badAddr:"ต้องเป็นที่อยู่ T 34 หลัก:",batchFail:"ค้นหาหลายรายการล้มเหลว"},
vi:{logo:"Tra cứu địa chỉ",backup:"Trang dự phòng",h1:"Tra cứu hàng loạt USDT & Đa chữ ký (Chỉ TRON)",ph:"Mỗi dòng 1 địa chỉ\nTối đa 2000 địa chỉ\nChỉ địa chỉ bắt đầu bằng T, 34 ký tự",query:"Tìm kiếm",retry:"Thử lại thất bại",export:"Xuất Excel",copyMulti:"Sao chép Đa chữ ký",no:"STT",addr:"Địa chỉ",multi:"Đa chữ ký",status:"Trạng thái",empty:"Nhập địa chỉ rồi bấm Tìm kiếm",yes:"Có",no2:"Không",success:"Thành công",fail:"Thất bại",checked:"Đã tra cứu:",ok:"Thành công:",fail2:"Thất bại:",done:"Hoàn thành",searching:"Đang tìm…",retrying:"Đang thử lại",noFail:"Không có địa chỉ thất bại",noMulti:"Không có địa chỉ đa chữ ký",copied:"Đã sao chép",noData:"Không có dữ liệu",enterAddr:"Vui lòng nhập địa chỉ trước",max2000:"Tối đa 2000 địa chỉ",badAddr:"Phải là địa chỉ T 34 ký tự:",batchFail:"Tra cứu hàng loạt thất bại"},
id:{logo:"Cek Alamat",backup:"Situs Cadangan",h1:"Cek Massal Saldo USDT & Multi-Sig (Hanya TRON)",ph:"Satu alamat per baris\nMaks 2000 alamat\nHanya alamat T, 34 karakter",query:"Cari",retry:"Coba Lagi yang Gagal",export:"Ekspor Excel",copyMulti:"Salin Multi-Sig",no:"No.",addr:"Alamat",multi:"Multi-Sig",status:"Status",empty:"Masukkan alamat lalu Cari",yes:"Ya",no2:"Tidak",success:"Berhasil",fail:"Gagal",checked:"Dicek:",ok:"Berhasil:",fail2:"Gagal:",done:"Selesai",searching:"Mencari…",retrying:"Mengulang",noFail:"Tidak ada alamat gagal",noMulti:"Tidak ada alamat multi-sig",copied:"Tersalin",noData:"Tidak ada data",enterAddr:"Masukkan alamat dulu",max2000:"Maks 2000 alamat",badAddr:"Harus alamat T 34 karakter:",batchFail:"Cek massal gagal"}
};
let curLang=localStorage.getItem('lang')||(()=>{const l=(navigator.language||'en').toLowerCase();if(l==='zh-tw'||l==='zh-hk'||l==='zh-mo'||l==='zh-hant')return 'hant';if(l.startsWith('zh'))return 'zh';if(l.startsWith('th'))return 'th';if(l.startsWith('vi'))return 'vi';if(l.startsWith('id')||l.startsWith('ms'))return 'id';return 'en';})();
function t(k){return (I18N[curLang]||I18N.en)[k]||I18N.en[k]||k;}
function setLang(l){curLang=l;localStorage.setItem('lang',l);document.getElementById('langSelect').value=l;document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=t(e.dataset.i18n);});document.querySelectorAll('[data-i18n-ph]').forEach(e=>{e.placeholder=t(e.dataset.i18nPh);});if(data.length)render();}
let data=[],k='',asc=false;
const mask=a=>a.length<10?a:a.slice(0,5)+'***'+a.slice(-5);
function sortBy(key){if(k===key)asc=!asc;else{k=key;asc=false;}data.sort((a,b)=>asc?a[key]-b[key]:b[key]-a[key]);render();}
function render(){const tb=document.getElementById('tbody');tb.innerHTML='';let sT=0,sU=0,sD=0,ok=0,fail=0;data.forEach((x,i)=>{sT+=x.trx||0;sU+=x.usdt||0;sD+=x.usdd||0;if(x.status==='成功')ok++;else fail++;const tr=document.createElement('tr');const st=x.status==='成功'?t('success'):t('fail');tr.innerHTML=`<td><input type="checkbox" class="chk" data-addr="${x.address}"></td><td>${i+1}</td><td style="font-family:monospace">${mask(x.address)}</td><td>${(x.trx||0).toFixed(1)}</td><td>${(x.usdt||0).toFixed(1)}</td><td>${(x.usdd||0).toFixed(1)}</td><td>${x.isMulti?t('yes'):t('no2')}</td><td style="color:${x.status==='成功'?'#15803d':'#dc2626'}">${st}</td>`;tb.appendChild(tr);});const el=document.getElementById('total');el.style.display='block';el.innerHTML=`TRX：${sT.toFixed(1)} &nbsp; USDT：${sU.toFixed(1)} &nbsp; USDD：${sD.toFixed(1)} &nbsp; ${t('checked')} ${data.length} &nbsp; ${t('ok')} <span style="color:#15803d">${ok}</span> &nbsp; ${t('fail2')} <span style="color:#dc2626">${fail}</span>`;document.getElementById('tbl').style.display='table';document.getElementById('empty').textContent='';document.getElementById('prog').textContent=`${t('done')} ${data.length}`;}
async function doBatch(){const lines=document.getElementById('input').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!lines.length)return alert(t('enterAddr'));if(lines.length>2000)return alert(t('max2000'));const bad=lines.find(a=>!a.startsWith('T')||a.length!==34);if(bad)return alert(t('badAddr')+bad);document.getElementById('prog').textContent=t('searching');try{const r=await fetch('/api/batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({addresses:lines})});const j=await r.json();if(j.error)throw new Error(j.error);data=j.results||[];render();}catch(e){alert(e.message||t('batchFail'));}}
async function retryFailed(){const fails=data.filter(x=>x.status==='失败').map(x=>x.address);if(!fails.length)return alert(t('noFail'));document.getElementById('prog').textContent=t('retrying')+' '+fails.length+'…';const r=await fetch('/api/batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({addresses:fails})});const j=await r.json();const map=new Map((j.results||[]).map(x=>[x.address,x]));data=data.map(x=>map.has(x.address)?map.get(x.address):x);render();}
function exportCSV(){if(!data.length)return alert(t('noData'));let csv='\uFEFF地址,TRX,USDT,USDD,是否多签,状态\n';data.forEach(x=>csv+=`"${x.address}","${x.trx}","${x.usdt}","${x.usdd}","${x.isMulti?t('yes'):t('no2')}","${x.status}"\n`);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='batch.csv';a.click();}
function copyMulti(){const l=data.filter(x=>x.isMulti).map(x=>x.address);if(!l.length)return alert(t('noMulti'));navigator.clipboard.writeText(l.join('\n')).then(()=>alert(t('copied')+' '+l.length));}
setLang(curLang);
</script></body></html>
